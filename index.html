<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Rem AI Chat - Re:Zero</title>
                <link rel="stylesheet" href="style.css">
                </head>
                <body>
                    <div class="chat-container">
                            <div class="chat-header">
                                        <img src="https://i.pinimg.com/originals/18/d9/15/18d91547b7ebafeb4a1eb40578864f1d.png" alt="Rem" class="avatar">
                                                    <h2>Rem AI Assistant</h2>
                                                                <p>Rem siap membantu Anda!</p>
                                                                        </div>
                                                                                <div class="chat-box" id="chat-box">
                                                                                            <div class="message ai-message">
                                                                                                            Halo! Saya Rem. Ada yang bisa Rem bantu hari ini?
                                                                                                                        </div>
                                                                                                                                </div>
                                                                                                                                        <div class="input-area">
                                                                                                                                                    <input type="text" id="user-input" placeholder="Ketik pesanmu di sini..." onkeypress="handleKeyPress(event)">
                                                                                                                                                                <button onclick="sendMessage()">Kirim</button>
                                                                                                                                                                        </div>
                                                                                                                                                                            </div>

                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                </body>
                                                                                                                                                                                </html>
